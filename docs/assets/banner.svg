        <path fill="#9DCCED" d="M11.998 4.115a.3.3 0 0 1 .126.033l6.715 3.818a.25.25 0 0 1 .126.214v7.635c0 .089-.048.17-.126.214l-6.715 3.819a.25.25 0 0 1-.126.032.3.3 0 0 1-.125-.032l-6.715-3.815a.25.25 0 0 1-.126-.215V8.182c0-.089.048-.17.126-.215l6.715-3.818a.26.26 0 0 1 .125-.034m0-1.115c-.238 0-.478.06-.692.183L4.593 7A1.36 1.36 0 0 0 3.9 8.182v7.635c0 .487.264.938.693 1.181l6.714 3.819a1.41 1.41 0 0 0 1.386 0l6.714-3.818a1.36 1.36 0 0 0 .693-1.182V8.182A1.36 1.36 0 0 0 19.407 7l-6.716-3.817A1.4 1.4 0 0 0 11.998 3"/>
        <path fill="#213147" d="m7.559 18.685.617-1.666 1.244 1.018-1.163 1.046z"/>
        <path fill="#FFFFFF" d="M11.433 7.635H9.731a.3.3 0 0 0-.285.197l-3.649 9.852 1.761 1.001 4.018-10.849a.15.15 0 0 0-.143-.2m2.979-.001h-1.703a.3.3 0 0 0-.284.197l-4.167 11.25 1.761 1 4.535-12.246a.15.15 0 0 0-.142-.2"/>
      </svg>
      <text x="234" y="196" font-size="34" font-weight="600" fill="#BFE3FF">on Arbitrum</text>

      <text x="72" y="262" font-size="32" font-weight="700" fill="#FFFFFF">Markets for AI agents</text>
      <text x="72" y="298" font-size="19" font-weight="500" fill="#CFE6FA">Arbitrum One · Robinhood Chain · one bytecode, no admin key</text>

      <!-- chips -->
      <g font-size="15" font-weight="600" fill="#E6F4FF">
        <rect x="72" y="326" width="168" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#9DCCED" stroke-opacity="0.45"/>
        <text x="156" y="348" text-anchor="middle">ERC-8004 identity</text>
        <rect x="252" y="326" width="124" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#9DCCED" stroke-opacity="0.45"/>
        <text x="314" y="348" text-anchor="middle">MCP · x402</text>
        <rect x="388" y="326" width="196" height="34" rx="17" fill="#00C805" fill-opacity="0.16" stroke="#4ADE80" stroke-opacity="0.55"/>
        <text x="486" y="348" text-anchor="middle">212 tickers reserved</text>
        <rect x="596" y="326" width="190" height="34" rx="17" fill="#16A34A" fill-opacity="0.22" stroke="#4ADE80" stroke-opacity="0.6"/>
        <text x="691" y="348" text-anchor="middle">Sourcify exact match</text>
      </g>
    </g>

    <!-- two chains, one curve -->
    <g>
      <rect x="812" y="60" width="400" height="280" rx="20" fill="#FFFFFF" fill-opacity="0.045" stroke="#28A0F0" stroke-opacity="0.45"/>
      <svg x="836" y="78" width="22" height="22" viewBox="0 0 24 24">
        <path fill="#9DCCED" d="M11.998 4.115a.3.3 0 0 1 .126.033l6.715 3.818a.25.25 0 0 1 .126.214v7.635c0 .089-.048.17-.126.214l-6.715 3.819a.25.25 0 0 1-.126.032.3.3 0 0 1-.125-.032l-6.715-3.815a.25.25 0 0 1-.126-.215V8.182c0-.089.048-.17.126-.215l6.715-3.818a.26.26 0 0 1 .125-.034m0-1.115c-.238 0-.478.06-.692.183L4.593 7A1.36 1.36 0 0 0 3.9 8.182v7.635c0 .487.264.938.693 1.181l6.714 3.819a1.41 1.41 0 0 0 1.386 0l6.714-3.818a1.36 1.36 0 0 0 .693-1.182V8.182A1.36 1.36 0 0 0 19.407 7l-6.716-3.817A1.4 1.4 0 0 0 11.998 3"/>
        <path fill="#12AAFF" d="m13.353 13.368-.885 2.39a.3.3 0 0 0 0 .205l1.523 4.112 1.76-1.001-2.113-5.706a.152.152 0 0 0-.285 0m1.774-4.019a.152.152 0 0 0-.285 0l-.885 2.39a.3.3 0 0 0 0 .205l2.494 6.732 1.761-1.001z"/>
        <path fill="#FFFFFF" d="M11.433 7.635H9.731a.3.3 0 0 0-.285.197l-3.649 9.852 1.761 1.001 4.018-10.849a.15.15 0 0 0-.143-.2m2.979-.001h-1.703a.3.3 0 0 0-.284.197l-4.167 11.25 1.761 1 4.535-12.246a.15.15 0 0 0-.142-.2"/>
      </svg>
      <svg x="1010" y="78" width="22" height="22" viewBox="0 0 24 24">
        <path fill="#00C805" d="M2.84 24h.53c.096 0 .192-.048.224-.128C7.591 13.696 11.94 8.656 14.67 5.638c.112-.128.064-.225-.096-.225h-4.88a.55.55 0 0 0-.45.225L5.746 9.972c-.514.642-.642 1.236-.642 2.086v4.43c-1.14 3.194-1.862 5.361-2.392 7.32-.032.125.016.192.129.192M20.447.646c-.754-.802-4.157-.834-5.73-.224a3 3 0 0 0-.786.465 41 41 0 0 0-3.323 3.178c-.112.113-.064.225.097.225h5.409c.497 0 .786.289.786.786v6.1c0 .16.128.208.225.064l3.258-4.254c.53-.69.69-.898.835-1.861.192-1.413.08-3.58-.77-4.479m-6.982 16.18 2.231-3.676a.7.7 0 0 0 .064-.29V6.73c0-.16-.112-.225-.224-.097-3.355 3.74-5.971 7.672-8.395 12.407-.06.12.016.225.16.177l5.009-1.54c.565-.174.882-.402 1.155-.852"/>
      </svg>
      <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        <text x="866" y="95" fill="#BFE3FF">Arbitrum One</text>
        <text x="1040" y="95" fill="#86EFAC">Robinhood Chain</text>
        <text x="1188" y="324" font-size="13" font-weight="500" fill="#BFE3FF" fill-opacity="0.8" text-anchor="end">supply sold →</text>
      </g>
      <path d="M842 300 H1188 M842 300 V118" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>
      <path d="M846 296 Q1010 292 1184 268" stroke="#4ADE80" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
      <text x="1184" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#86EFAC" text-anchor="end">floor only rises</text>
      <path d="M846 294 C 970 290, 1080 246, 1182 124" stroke="url(#curve)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.35" filter="url(#soft)"/>
      <path d="M846 294 C 970 290, 1080 246, 1182 124" stroke="url(#curve)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <g fill="#FFFFFF">
        <circle cx="900" cy="290" r="5"/>
        <circle cx="972" cy="282" r="5"/>
        <circle cx="1040" cy="262" r="5"/>
        <circle cx="1098" cy="227" r="5"/>
